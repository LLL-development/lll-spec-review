<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__BRAND__ — ビューア</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="viewer-body">
  <div class="viewer-toolbar">
    <a class="brand" href="dashboard.html" style="gap:8px;">
      <span class="hanko" style="width:30px;height:30px;font-size:17px;" data-brand="mark"></span>
    </a>
    <a class="btn btn-ghost btn-sm" id="back-link" href="dashboard.html">
      <span class="label-desktop" data-i18n="viewer.back"></span><span class="label-mobile" data-i18n="viewer.backShort"></span>
    </a>
    <span class="doc-name" id="doc-name" data-i18n="viewer.loading">読み込み中…</span>
    <select id="version-select" onchange="switchVersion(this.value)"></select>
    <div class="spacer"></div>
    <button class="btn btn-sm btn-shu" id="mode-btn" style="display:none" onclick="toggleMode()">
      <span class="label-desktop" data-i18n="viewer.commentMode"></span><span class="label-mobile" data-i18n="viewer.commentModeShort"></span>
    </button>
    <button class="btn btn-ghost btn-sm" id="diff-btn" style="display:none" onclick="toggleDiffBar()">
      <span class="label-desktop" data-i18n="viewer.diff"></span><span class="label-mobile" data-i18n="viewer.diffShort"></span>
    </button>
    <button class="btn btn-ghost btn-sm" id="fullscreen-btn" onclick="toggleFullscreen()">
      <span class="label-desktop" data-i18n="viewer.fullscreen"></span><span class="label-mobile" data-i18n="viewer.fullscreenShort"></span>
    </button>
    <button class="btn btn-ghost btn-sm panel-toggle" id="panel-btn" onclick="togglePanel()">
      💬 <span id="comment-count">0</span>
    </button>
  </div>

  <div class="diff-bar" id="diff-bar" hidden>
    <span class="diff-bar-label" data-i18n="viewer.diffBase"></span>
    <select id="diff-base"></select>
    <span class="diff-bar-arrow">→</span>
    <span class="diff-bar-label" data-i18n="viewer.diffCompare"></span>
    <select id="diff-compare"></select>
    <button class="btn btn-sm btn-shu" onclick="runDiff()" data-i18n="viewer.diffRun"></button>
    <span class="diff-legend"><ins data-i18n="viewer.diffAdded"></ins> <del data-i18n="viewer.diffRemoved"></del></span>
    <div class="spacer"></div>
    <button class="btn btn-ghost btn-sm" onclick="closeDiff()" data-i18n="viewer.close"></button>
  </div>

  <div class="viewer-main">
    <div class="frame-wrap" id="frame-wrap">
      <iframe id="doc-frame" sandbox="allow-scripts allow-popups" data-i18n-title="viewer.frameTitle"></iframe>
      <div class="mode-hint" id="mode-hint" hidden>
        <span class="hint-desktop" data-i18n="viewer.hintDesktop"></span>
        <span class="hint-mobile" data-i18n="viewer.hintMobile"></span>
      </div>
    </div>

    <aside class="comment-panel" id="panel">
      <div class="panel-head">
        <span class="eyebrow" style="margin:0" data-i18n="viewer.panelHeading">Comments</span>
        <button class="btn btn-ghost btn-sm panel-close" onclick="togglePanel()">✕</button>
      </div>

      <!-- compose: appears after placing a pin -->
      <div class="compose card" id="compose" hidden>
        <div class="compose-anchor" id="compose-anchor"></div>
        <textarea id="compose-body" rows="3" placeholder="コメントを入力…" data-i18n-placeholder="viewer.composePlaceholder"></textarea>
        <div class="compose-actions">
          <button class="btn btn-sm btn-shu" onclick="postComment()" data-i18n="viewer.post"></button>
          <button class="btn btn-ghost btn-sm" onclick="cancelCompose()" data-i18n="viewer.cancel"></button>
        </div>
      </div>

      <label class="resolved-filter">
        <span data-i18n="viewer.resolvedFilter"></span>
        <select id="resolved-filter" onchange="onFilterChange()">
          <option value="all" selected data-i18n="viewer.filterAll"></option>
          <option value="unresolved" data-i18n="viewer.filterUnresolved"></option>
          <option value="resolved" data-i18n="viewer.filterResolved"></option>
        </select>
      </label>

      <div id="threads" class="threads">
        <div class="empty" style="padding:20px" data-i18n="viewer.loading">読み込み中…</div>
      </div>
    </aside>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/diff.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // i18n availability guard (same spirit as project.html/dashboard.html): if
    // js/i18n.js failed to load (404 etc.), fall back to the key string.
    const HAS_I18N = typeof window.I18N !== "undefined" && typeof window.I18N.setLang === "function";
    function tOr(key, params) {
      return (window.I18N && typeof I18N.t === "function") ? I18N.t(key, params) : key;
    }

    let docMeta = null;
    let comments = [];
    let mode = "browse";
    let draftAnchor = null;
    let frameReady = false;
    let pollTimer = null;

    const frame = () => document.getElementById("doc-frame");

    async function init() {
      const profile = await requireAuth();
      if (!profile) return;
      const docId = qs("doc");
      if (!docId) { location.href = "dashboard.html"; return; }
      // Repaint JS-built labels on language switch (not covered by apply()).
      if (window.I18N && typeof I18N.onChange === "function") {
        I18N.onChange(() => {
          updateModeBtn();
          updateFullscreenBtn();
          rebuildVersionSelects();
          renderThreads();
        });
      }
      window.addEventListener("message", onFrameMessage);
      await loadDoc(docId, true);
      pollTimer = setInterval(refreshComments, 15000);
      document.addEventListener("visibilitychange", () => {
        if (!document.hidden) refreshComments();
      });
    }

    document.getElementById("threads").addEventListener("input", (e) => {
      if (e.target.matches(".reply-box textarea") && openReplyId) {
        openReplyDraft = e.target.value;
      }
    });

    async function loadDoc(docId, buildVersionList) {
      frameReady = false;
      try {
        docMeta = await apiGet(`/api/documents/${docId}`);
      } catch (e) {
        const nameEl = document.getElementById("doc-name");
        nameEl.textContent = tOr("viewer.error.docNotFound");
        nameEl.setAttribute("data-i18n-error", "viewer.error.docNotFound");
        nameEl.removeAttribute("data-i18n");
        return;
      }

      document.getElementById("back-link").href = `project.html?id=${docMeta.project_id}`;
      const nameEl = document.getElementById("doc-name");
      nameEl.textContent = docMeta.filename;
      nameEl.removeAttribute("data-i18n");
      document.title = `${BRAND.nameJa} — ${docMeta.filename}`;
      document.getElementById("mode-btn").style.display = docMeta.can_comment ? "" : "none";
      document.getElementById("diff-btn").style.display = docMeta.versions.length > 1 ? "" : "none";

      if (buildVersionList) {
        const sel = document.getElementById("version-select");
        sel.innerHTML = versionOptions(docMeta.id);
      }

      try {
        const overlayP = apiText("/js/overlay.js");
        const html = await docToHtml(docMeta.filename, docId);
        const overlay = await overlayP;
        const tag = `\n<script>${overlay}<\/script>\n`;
        const injected = /<\/body>/i.test(html)
          ? html.replace(/<\/body>/i, tag + "</body>")
          : html + tag;
        frame().src = URL.createObjectURL(new Blob([injected], { type: "text/html" }));
      } catch (e) {
        toast(tOr("viewer.error.fetchFile", { message: e.message }), true);
        return;
      }

      cancelCompose();
      await refreshComments();
    }

    const IMAGE_EXTS = ["png", "jpg", "jpeg", "gif", "webp", "svg"];

    function extOf(name) { return (name.split(".").pop() || "").toLowerCase(); }

    function docWrapper(inner, opts = {}) {
      return `<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Zen Kaku Gothic New", sans-serif;
         color:#26241f; line-height:1.75; max-width:820px; margin:0 auto; padding:32px 20px 80px; }
  h1,h2,h3 { line-height:1.35; margin:1.4em 0 .5em; }
  h1 { font-size:1.7em; border-bottom:2px solid #e5e1d4; padding-bottom:.3em; }
  h2 { font-size:1.35em; border-bottom:1px solid #e5e1d4; padding-bottom:.25em; }
  code { background:#f2efe6; padding:.15em .4em; border-radius:3px; font-size:.9em; }
  pre { background:#f2efe6; padding:14px; border-radius:5px; overflow:auto; }
  pre code { background:none; padding:0; }
  table { border-collapse:collapse; margin:1em 0; }
  th,td { border:1px solid #d6d2c4; padding:6px 12px; }
  th { background:#f2efe6; }
  blockquote { border-left:3px solid #b23a2a; margin:1em 0; padding:.2em 1em; color:#6b675c; }
  img { max-width:100%; }
  ${opts.center ? "body{display:flex;align-items:center;justify-content:center;min-height:96vh;}" : ""}
</style></head><body>${inner}</body></html>`;
    }

    async function docToHtml(filename, docId) {
      const ext = extOf(filename);
      if (IMAGE_EXTS.includes(ext) && ext !== "svg") {
        const dataUri = await apiDataUri(`/api/documents/${docId}/content`);
        return docWrapper(`<img src="${dataUri}" alt="${escapeHtml(filename)}">`, { center: true });
      }
      const text = await apiText(`/api/documents/${docId}/content`);
      if (ext === "html" || ext === "htm") return text;
      if (ext === "svg") return docWrapper(text, { center: true });
      if (ext === "md") return docWrapper(marked.parse(text));
      return docWrapper(`<pre style="white-space:pre-wrap">${escapeHtml(text)}</pre>`);
    }

    async function switchVersion(docId) {
      history.replaceState(null, "", `viewer.html?doc=${docId}`);
      await loadDoc(docId, false);
      const sel = document.getElementById("version-select");
      if (sel) sel.value = docId;
    }

    async function refreshComments() {
      if (!docMeta) return;
      try {
        comments = await apiGet(`/api/documents/${docMeta.id}/comments`);
      } catch (e) { return; }
      renderThreads();
      sendState();
    }

    const topLevel = () => comments.filter(c => !c.parent_id);
    const repliesOf = (id) => comments.filter(c => c.parent_id === id);
    const numberOf = (id) => topLevel().findIndex(c => c.id === id) + 1;
    function anchorPreview(c) {
      if (!c.anchor) return "";
      if (c.anchor.kind === "range" && c.anchor.quote) return "“" + c.anchor.quote.slice(0, 48) + "”";
      if (c.anchor.text) return c.anchor.text.slice(0, 48);
      return "";
    }

    function onFrameMessage(e) {
      const m = e.data || {};
      if (m.ns !== "lllsr") return;
      if (m.t === "ready") {
        frameReady = true;
        sendState();
        if (frameReadyResolve) { const r = frameReadyResolve; frameReadyResolve = null; setTimeout(r, 50); }
      }
      if (m.t === "place" && mode === "comment" && docMeta?.can_comment) {
        draftAnchor = m.anchor;
        openCompose();
        sendState();
      }
      if (m.t === "open") focusThread(m.id);
    }

    function passesResolvedFilter(c) {
      const v = document.getElementById("resolved-filter").value; // all|unresolved|resolved
      if (v === "unresolved") return !c.resolved;
      if (v === "resolved") return !!c.resolved;
      return true; // all
    }

    function onFilterChange() {
      renderThreads();
      sendState();
    }

    function sendState() {
      if (!frameReady) return;
      const pins = topLevel()
        .filter(c => c.anchor && passesResolvedFilter(c))
        .map(c => ({ id: c.id, n: numberOf(c.id), resolved: !!c.resolved, anchor: c.anchor }));
      if (draftAnchor) pins.push({ id: "draft", draft: true, anchor: draftAnchor });
      frame().contentWindow.postMessage({ ns: "lllsr-host", t: "state", mode, pins }, "*");
    }

    function focusPin(id) {
      if (!frameReady) return;
      frame().contentWindow.postMessage({ ns: "lllsr-host", t: "focus", id }, "*");
    }

    function setButtonLabels(btn, desktopLabel, mobileLabel) {
      btn.querySelector(".label-desktop").textContent = desktopLabel;
      btn.querySelector(".label-mobile").textContent = mobileLabel;
    }

    function updateModeBtn() {
      const btn = document.getElementById("mode-btn");
      setButtonLabels(
        btn,
        mode === "comment" ? tOr("viewer.commentModeOn") : tOr("viewer.commentMode"),
        mode === "comment" ? tOr("viewer.commentModeOnShort") : tOr("viewer.commentModeShort")
      );
    }

    function toggleMode() {
      mode = mode === "comment" ? "browse" : "comment";
      const btn = document.getElementById("mode-btn");
      btn.classList.toggle("btn-shu", mode !== "comment");
      btn.classList.toggle("mode-active", mode === "comment");
      updateModeBtn();
      document.getElementById("mode-hint").hidden = mode !== "comment";
      sendState();
    }

    function openCompose() {
      openPanelIfMobile();
      const box = document.getElementById("compose");
      box.hidden = false;
      const preview = draftAnchor?.kind === "range"
        ? "“" + (draftAnchor.quote || "").slice(0, 60) + "”"
        : (draftAnchor?.text ? draftAnchor.text.slice(0, 60) : tOr("viewer.selectedHere"));
      document.getElementById("compose-anchor").textContent = "📍 " + preview;
      document.getElementById("compose-body").focus();
    }

    function cancelCompose() {
      draftAnchor = null;
      document.getElementById("compose").hidden = true;
      document.getElementById("compose-body").value = "";
      sendState();
    }

    async function postComment() {
      const body = document.getElementById("compose-body").value.trim();
      if (!body) { toast(tOr("viewer.toast.commentRequired"), true); return; }
      try {
        await apiPost(`/api/documents/${docMeta.id}/comments`, { body, anchor: draftAnchor });
        cancelCompose();
        if (mode === "comment") toggleMode();
        await refreshComments();
        toast(tOr("viewer.toast.commentPosted"));
      } catch (e) { toast(e.message, true); }
    }

    function renderThreads() {
      if (!docMeta) return; // still loading: keep placeholder
      const el = document.getElementById("threads");
      const items = topLevel().filter(passesResolvedFilter);
      document.getElementById("comment-count").textContent =
        topLevel().filter(c => !c.resolved).length;

      if (!items.length) {
        el.innerHTML = `<div class="empty" style="padding:24px 12px">${escapeHtml(tOr("viewer.emptyTitle"))}<br>
          ${docMeta?.can_comment ? escapeHtml(tOr("viewer.emptyHint")) : ""}</div>`;
        return;
      }

      el.innerHTML = items.map(c => {
        const n = numberOf(c.id);
        const replies = repliesOf(c.id);
        const mine = c.author_id === currentProfile.id;
        return `
        <div class="thread ${c.resolved ? "resolved" : ""}" id="thread-${c.id}">
          <div class="thread-head">
            <button class="pin-chip" onclick="focusPin('${c.id}')" title="${escapeHtml(tOr("viewer.pinTitle"))}">${n}</button>
            <div class="thread-meta">
              <span class="thread-author">${escapeHtml(c.author_name)}${c.author_role === "internal" ? ' <span class="badge badge-ai" style="font-size:10px">LLL</span>' : ""}</span>
              <span class="thread-time">${fmtDate(c.created_at)}</span>
            </div>
            ${c.resolved ? `<span class="badge">${escapeHtml(tOr("viewer.badgeResolved"))}</span>` : ""}
          </div>
          ${anchorPreview(c) ? `<div class="thread-anchor" onclick="focusPin('${c.id}')">📍 ${escapeHtml(anchorPreview(c))}</div>` : ""}
          <div class="thread-body">${escapeHtml(c.body)}</div>
          ${replies.map(r => `
            <div class="reply">
              <div class="thread-meta">
                <span class="thread-author">${escapeHtml(r.author_name)}${r.author_role === "internal" ? ' <span class="badge badge-ai" style="font-size:10px">LLL</span>' : ""}</span>
                <span class="thread-time">${fmtDate(r.created_at)}</span>
              </div>
              <div class="thread-body">${escapeHtml(r.body)}</div>
              ${(r.author_id === currentProfile.id || isInternal()) ? `<button class="link-btn" onclick="deleteComment('${r.id}')">${escapeHtml(tOr("viewer.delete"))}</button>` : ""}
            </div>`).join("")}
          <div class="thread-actions">
            ${docMeta?.can_comment ? `<button class="link-btn" onclick="toggleReply('${c.id}')">${escapeHtml(tOr("viewer.reply"))}</button>` : ""}
            ${docMeta && docMeta.versions.length > 1 ? `<button class="link-btn" onclick="reviewChanges('${c.id}')">${escapeHtml(tOr("viewer.reviewChanges"))}</button>` : ""}
            ${docMeta?.can_comment ? `<button class="link-btn" onclick="setResolved('${c.id}', ${c.resolved ? "false" : "true"})">${escapeHtml(c.resolved ? tOr("viewer.reopen") : tOr("viewer.resolve"))}</button>` : ""}
            ${(mine || isInternal()) ? `<button class="link-btn" onclick="deleteComment('${c.id}')">${escapeHtml(tOr("viewer.delete"))}</button>` : ""}
          </div>
          <div class="reply-box" id="reply-${c.id}" hidden>
            <textarea rows="2" placeholder="${escapeHtml(tOr("viewer.replyPlaceholder"))}"></textarea>
            <button class="btn btn-sm" onclick="postReply('${c.id}')">${escapeHtml(tOr("viewer.postReply"))}</button>
          </div>
        </div>`;
      }).join("");

      if (openReplyId) {
        const box = document.getElementById(`reply-${openReplyId}`);
        if (box) {
          box.hidden = false;
          const ta = box.querySelector("textarea");
          ta.value = openReplyDraft;
          ta.focus();
          ta.selectionStart = ta.selectionEnd = ta.value.length;
        }
      }
    }

    let openReplyId = null;
    let openReplyDraft = "";

    function toggleReply(id) {
      const box = document.getElementById(`reply-${id}`);
      const opening = box.hidden;
      if (openReplyId && openReplyId !== id) {
        const prevBox = document.getElementById(`reply-${openReplyId}`);
        if (prevBox) prevBox.hidden = true;
      }
      box.hidden = !opening;
      openReplyId = opening ? id : null;
      openReplyDraft = "";
      if (opening) box.querySelector("textarea").focus();
    }

    async function postReply(parentId) {
      const box = document.getElementById(`reply-${parentId}`);
      const body = box.querySelector("textarea").value.trim();
      if (!body) return;
      try {
        await apiPost(`/api/documents/${docMeta.id}/comments`, { body, parent_id: parentId });
        openReplyId = null;
        openReplyDraft = "";
        await refreshComments();
      } catch (e) { toast(e.message, true); }
    }

    async function setResolved(id, resolved) {
      try {
        await api(`/api/comments/${id}`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ resolved }),
        });
        await refreshComments();
        if (resolved) {
          const c = comments.find(x => x.id === id);
          if (c) await openDiffForComment(c);
        }
      } catch (e) { toast(e.message, true); }
    }

    async function deleteComment(id) {
      const ok = await appConfirm({
        title: tOr("viewer.confirm.deleteComment"),
        message: tOr("viewer.confirm.deleteCommentMsg"),
        okLabel: tOr("viewer.confirm.deleteOk"),
        danger: true,
      });
      if (!ok) return;
      try {
        await apiDelete(`/api/comments/${id}`);
        await refreshComments();
      } catch (e) { toast(e.message, true); }
    }

    function focusThread(id) {
      openPanelIfMobile();
      const t = comments.find(x => x.id === id);
      if (t && !passesResolvedFilter(t)) {
        document.getElementById("resolved-filter").value = "all";
      }
      renderThreads();
      sendState();
      const el = document.getElementById(`thread-${id}`);
      if (el) {
        el.scrollIntoView({ block: "center", behavior: "smooth" });
        el.classList.add("flash");
        setTimeout(() => el.classList.remove("flash"), 1600);
      }
    }

    const TEXT_EXTS = ["html", "htm", "md", "txt", "svg"];
    function isTextDoc() { return TEXT_EXTS.includes(extOf(docMeta.filename)); }

    function versionOptions(selectedId) {
      return docMeta.versions.map((v, i) =>
        `<option value="${v.id}" ${v.id === selectedId ? "selected" : ""}>v${v.version}${i === 0 ? tOr("viewer.latestVersionSuffix") : ""}</option>`
      ).join("");
    }

    // Rebuild version <option>s so the "(latest)" suffix follows language switches.
    function rebuildVersionSelects() {
      if (!docMeta) return;
      const sel = document.getElementById("version-select");
      if (sel) {
        const current = sel.value || docMeta.id;
        sel.innerHTML = versionOptions(current);
        sel.value = current;
      }
      const bar = document.getElementById("diff-bar");
      if (bar && !bar.hidden) {
        for (const id of ["diff-base", "diff-compare"]) {
          const s = document.getElementById(id);
          if (!s) continue;
          const cur = s.value;
          s.innerHTML = versionOptions(cur);
          s.value = cur;
        }
      }
    }

    function toggleDiffBar() {
      const bar = document.getElementById("diff-bar");
      const show = bar.hidden;
      bar.hidden = !show;
      if (show) {
        const vs = docMeta.versions;
        const base = vs[1] ? vs[1].id : vs[0].id;
        const compare = vs[0].id;
        document.getElementById("diff-base").innerHTML = versionOptions(base);
        document.getElementById("diff-compare").innerHTML = versionOptions(compare);
      }
    }
    function closeDiff() {
      document.getElementById("diff-bar").hidden = true;
      loadDoc(docMeta.id, false);
    }

    function rawTextOf(doc) {
      const walker = doc.createTreeWalker(doc.body, NodeFilter.SHOW_TEXT, {
        acceptNode(n) {
          const tag = n.parentNode && n.parentNode.tagName;
          return (tag === "SCRIPT" || tag === "STYLE") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT;
        },
      });
      let full = "", n;
      while ((n = walker.nextNode())) full += n.nodeValue;
      return full;
    }

    async function renderedTextOf(docId) {
      const html = await docToHtml(docMeta.filename, docId);
      return new Promise((resolve) => {
        const ifr = document.createElement("iframe");
        ifr.style.cssText = "position:fixed;left:-9999px;top:-9999px;width:900px;height:1200px;visibility:hidden;";
        ifr.sandbox = "allow-same-origin";
        document.body.appendChild(ifr);
        ifr.onload = () => {
          const d = ifr.contentDocument;
          const text = d && d.body ? rawTextOf(d) : "";
          ifr.remove();
          resolve(text);
        };
        ifr.src = URL.createObjectURL(new Blob([html], { type: "text/html" }));
      });
    }

    async function renderVersion(docId) {
      const filename = docMeta.filename;
      const html = await docToHtml(filename, docId);
      const overlay = await apiText("/js/overlay.js");
      const tag = `\n<script>${overlay}<\/script>\n`;
      const injected = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, tag + "</body>") : html + tag;
      frame().src = URL.createObjectURL(new Blob([injected], { type: "text/html" }));
      await new Promise(res => { frameReadyResolve = res; });
    }

    let frameReadyResolve = null;

    async function runDiff() {
      if (!isTextDoc()) { toast(tOr("viewer.toast.imageDiffUnsupported"), true); return; }
      const baseId = document.getElementById("diff-base").value;
      const compareId = document.getElementById("diff-compare").value;
      if (baseId === compareId) { toast(tOr("viewer.toast.pickVersions"), true); return; }
      try {
        const [, oldVisible, newVisible] = await Promise.all([
          renderVersion(compareId), renderedTextOf(baseId), renderedTextOf(compareId),
        ]);
        const { newMarks } = diffText(oldVisible, newVisible);
        frame().contentWindow.postMessage({ ns: "lllsr-host", t: "diffmarks", marks: newMarks }, "*");
        toast(tOr("viewer.toast.diffHighlights", { count: newMarks.length }));
      } catch (e) {
        toast(tOr("viewer.error.diffFailed", { message: e.message }), true);
      }
    }

    async function reviewChanges(commentId) {
      const c = comments.find(x => x.id === commentId);
      if (!c) return;
      openDiffForComment(c);
    }

    async function openDiffForComment(c) {
      const versions = docMeta.versions;
      let targetVersion = versions[0];
      let marksToSend = [];

      if (versions.length > 1 && isTextDoc()) {
        try {
          const needle = c.anchor
            ? (c.anchor.kind === "range" ? c.anchor.quote : c.anchor.text)
            : null;
          const normalize = (text) => text.replace(/\s+/g, " ");
          const hasQuote = (text, q) => normalize(text).indexOf(q) !== -1;

          const texts = [await renderedTextOf(versions[0].id)];
          let deletionFoundAt = -1;

          if (needle && !hasQuote(texts[0], needle)) {
            for (let k = 1; k < versions.length; k++) {
              texts[k] = await renderedTextOf(versions[k].id);
              if (hasQuote(texts[k], needle)) { deletionFoundAt = k; break; }
            }
          }

          if (deletionFoundAt !== -1) {
            const older = texts[deletionFoundAt];
            const newer = texts[deletionFoundAt - 1];
            const { newMarks, oldMarks } = diffText(older, newer);

            const approxStart = normalize(older).indexOf(needle);
            const approxEnd = approxStart + needle.length;
            const overlapsNeedle = (m) => m.start < approxEnd && m.end > approxStart;

            const relevantOldMarks = oldMarks.filter(overlapsNeedle);

            const isReplacement = approxStart !== -1 && relevantOldMarks.some((m) => !m.pure);

            if (isReplacement) {
              targetVersion = versions[deletionFoundAt - 1];
              marksToSend = newMarks;
            } else {
              targetVersion = versions[deletionFoundAt];
              marksToSend = relevantOldMarks;
            }
          } else {
            const prevText = texts[1] || await renderedTextOf(versions[1].id);
            const { newMarks } = diffText(prevText, texts[0]);
            targetVersion = versions[0];
            marksToSend = newMarks;
          }
        } catch (e) { /* non-fatal */ }
      }

      const onTarget = docMeta.id === targetVersion.id;
      if (!onTarget) { await switchVersion(targetVersion.id); }

      if (docMeta.versions.length > 1 && isTextDoc()) {
        frame().contentWindow.postMessage({ ns: "lllsr-host", t: "diffmarks", marks: marksToSend, noScroll: true }, "*");
      }

      if (c.anchor) {
        frame().contentWindow.postMessage({ ns: "lllsr-host", t: "focus", id: c.id, anchor: c.anchor }, "*");
      }

      focusThread(c.id);
    }

    // ---------- panel (mobile bottom sheet) ----------

    function togglePanel() {
      document.getElementById("panel").classList.toggle("open");
    }
    function openPanelIfMobile() {
      if (window.matchMedia("(max-width: 900px)").matches) {
        document.getElementById("panel").classList.add("open");
      }
    }

    // ---------- fullscreen ----------
    function toggleFullscreen() {
      const el = document.getElementById("frame-wrap");
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el)
          .catch((e) => toast(tOr("viewer.error.fullscreenFailed", { message: e.message }), true));
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
      }
    }

    document.addEventListener("fullscreenchange", updateFullscreenBtn);
    document.addEventListener("webkitfullscreenchange", updateFullscreenBtn);
    function updateFullscreenBtn() {
      const btn = document.getElementById("fullscreen-btn");
      if (!btn) return;
      setButtonLabels(
        btn,
        document.fullscreenElement ? tOr("viewer.fullscreenExit") : tOr("viewer.fullscreen"),
        document.fullscreenElement ? tOr("viewer.fullscreenExitShort") : tOr("viewer.fullscreenShort")
      );
    }

    init();
  </script>
</body>
