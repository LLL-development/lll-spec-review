<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>__BRAND__ — プロジェクト</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="app-header"></header>

  <main class="container">
    <div class="eyebrow" data-i18n="project.eyebrow"></div>
    <h1 class="page-title" id="project-title" data-i18n="project.loading"></h1>

    <!-- Upload (internal only) -->
    <div class="card dropzone" id="upload-card" style="display:none; margin-bottom:8px;">
      <div class="form-row">
        <div class="field">
          <label for="file-input" data-i18n="project.label.upload"></label>
          <div class="file-picker">
            <input type="file" id="file-input" multiple accept=".html,.htm,.md,.txt,.png,.jpg,.jpeg,.gif,.webp,.svg" onchange="updateFileNames()">
            <label class="btn btn-ghost" for="file-input" data-i18n="project.chooseFile"></label>
            <span class="file-names" id="file-names" data-i18n="project.noFile"></span>
          </div>
        </div>
        <button class="btn btn-shu" id="upload-btn" onclick="uploadSelected()" data-i18n="project.submit.upload"></button>
      </div>
      <div class="drop-hint" data-i18n="project.dropHint"></div>
      <p style="font-size:12px; color:var(--ink-soft); margin-top:8px;" data-i18n="project.note.versions">
      </p>
    </div>

    <h2 class="section-title" data-i18n="project.section.documents"></h2>
    <div class="list" id="doc-list"><div class="empty" data-i18n="project.loading"></div></div>

    <!-- Members (internal only) -->
    <section id="members-section" style="display:none">
      <h2 class="section-title" data-i18n="project.section.members"></h2>
      <div class="card" style="margin-bottom:12px;">
        <div class="form-row">
          <div class="field">
            <label for="member-email" data-i18n="project.label.email"></label>
            <input type="email" id="member-email" placeholder="client@example.com">
          </div>
          <div class="field">
            <label for="member-name" data-i18n="project.label.name"></label>
            <input type="text" id="member-name" data-i18n-placeholder="project.placeholder.name">
          </div>
          <div class="field" style="flex:0 0 200px;">
            <label for="member-role" data-i18n="project.label.role"></label>
            <select id="member-role">
              <option value="client_commenter" data-i18n="project.role.client_commenter"></option>
              <option value="client_viewer" data-i18n="project.role.client_viewer"></option>
              <option value="owner" data-i18n="project.role.owner"></option>
            </select>
          </div>
          <button class="btn" onclick="inviteMember()" data-i18n="project.submit.invite"></button>
        </div>
        <p style="font-size:12px; color:var(--ink-soft); margin-top:8px;" data-i18n="project.note.invite">
        </p>
        <div class="card pw-card" id="pw-reveal" hidden>
          <div id="pw-title" style="font-weight:700; font-size:14px; margin-bottom:6px;"></div>
          <code id="pw-value"></code>
          <button class="btn btn-ghost btn-sm" onclick="copyPassword()" style="margin-left:8px;" data-i18n="project.copy"></button>
          <div class="pw-note" data-i18n="project.pw.note"></div>
        </div>
      </div>
      <div class="list" id="member-list"></div>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/brand.js"></script>
  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
  <script>
    // i18n availability guard (same spirit as dashboard.html): if js/i18n.js failed
    // to load (404 etc.), fall back to the key string instead of ReferenceError.
    function tOr(key, params) {
      return (window.I18N && typeof I18N.t === "function") ? I18N.t(key, params) : key;
    }

    const projectId = qs("id");
    let canManage = false;
    let docGroups = [];
    // Last successful payloads / server errors (null = none yet). Cached so
    // I18N.onChange can repaint lists in the new language without re-fetching.
    let docsCache = null, docsError = null;   // docsError: server message as-is
    let membersCache = null, membersError = null;

    async function init() {
      const profile = await requireAuth();
      if (!profile) return;
      renderHeader();
      if (!projectId) { location.href = "dashboard.html"; return; }

      // Repaint dynamic lists on language switch: their nodes are built in JS
      // and are NOT covered by apply()'s [data-i18n*] sweep. Subscribe BEFORE
      // the first load so switches during loading also repaint.
      if (window.I18N && typeof I18N.onChange === "function") {
        I18N.onChange(() => { renderDocuments(); renderMembers(); });
      }

      let project;
      try {
        project = await apiGet(`/api/projects/${projectId}`);
        const titleEl = document.getElementById("project-title");
        titleEl.textContent = project.name;
        // Drop the data-i18n hook so later apply()/setLang() sweeps don't
        // overwrite the real project name with the "loading" placeholder.
        titleEl.removeAttribute("data-i18n");
        document.title = `${BRAND.nameJa} — ${project.name}`;
      } catch (e) {
        document.getElementById("project-title").textContent = tOr("project.error.notFound");
        return;
      }

      canManage = project.can_manage;
      if (project.can_manage) {
        document.getElementById("upload-card").style.display = "";
        document.getElementById("members-section").style.display = "";
        await loadMembers();
      }
      await loadDocuments();
    }

    // ---------- documents ----------

    function renderDocuments() {
      const el = document.getElementById("doc-list");
      // Build via DOM APIs with textContent only (no innerHTML — XSS policy).
      el.textContent = "";
      if (docsError !== null) {
        // Server messages are not translatable keys: show as-is.
        const err = document.createElement("div");
        err.className = "empty";
        err.textContent = docsError;
        el.appendChild(err);
        return;
      }
      if (!docsCache) return; // not loaded yet: keep the loading placeholder
      if (!docsCache.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = tOr("project.docs.empty");
        el.appendChild(empty);
        return;
      }
      docGroups.forEach((g, i) => {
        const latest = g.versions[0];
        const a = document.createElement("a");
        a.className = "list-item";
        a.href = `viewer.html?doc=${latest.id}`;
        const main = document.createElement("div");
        main.className = "item-main";
        const title = document.createElement("div");
        title.className = "item-title";
        title.textContent = g.filename;
        const sub = document.createElement("div");
        sub.className = "item-sub";
        sub.textContent = tOr("project.docs.lastUpdated", { date: fmtDate(latest.uploaded_at) });
        main.append(title, sub);
        const side = document.createElement("div");
        side.className = "item-side";
        const vBadge = document.createElement("span");
        vBadge.className = "badge badge-shu";
        vBadge.textContent = `v${latest.version}`;
        const nBadge = document.createElement("span");
        nBadge.className = "badge";
        nBadge.textContent = tOr(g.versions.length > 1 ? "project.docs.versions" : "project.docs.version", { count: g.versions.length });
        const dlBtn = document.createElement("button");
        dlBtn.className = "btn btn-ghost btn-sm";
        dlBtn.textContent = tOr("project.docs.download");
        dlBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); downloadDoc(i); });
        side.append(vBadge, nBadge, dlBtn);
        if (canManage) {
          const delBtn = document.createElement("button");
          delBtn.className = "btn btn-ghost btn-sm";
          delBtn.textContent = tOr("project.docs.delete");
          delBtn.addEventListener("click", (e) => { e.preventDefault(); e.stopPropagation(); deleteDocGroup(i); });
          side.appendChild(delBtn);
        }
        a.append(main, side);
        el.appendChild(a);
      });
    }

    async function loadDocuments() {
      try {
        const docs = await apiGet(`/api/projects/${projectId}/documents`);
        // group by filename → show latest version, link to viewer
        const groups = {};
        for (const d of docs) (groups[d.filename] ??= []).push(d);
        docGroups = Object.entries(groups).map(([filename, versions]) => ({ filename, versions }));
        docsError = null;
        docsCache = docs;
      } catch (e) {
        docsError = (e && e.message) || "";
        docsCache = null;
        docGroups = [];
      }
      renderDocuments();
    }

    async function downloadDoc(i) {
      const g = docGroups[i];
      if (!g) return;
      const latest = g.versions[0];
      try {
        const res = await fetch(`/api/documents/${latest.id}/content`, { credentials: "same-origin" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = g.filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      } catch (e) {
        toast(`${tOr("project.error.download")}: ${e.message}`, true);
      }
    }

    function updateFileNames() {
      const files = document.getElementById("file-input").files;
      const el = document.getElementById("file-names");
      if (!files.length) el.textContent = tOr("project.noFile");
      else if (files.length === 1) el.textContent = files[0].name;
      else el.textContent = tOr("project.filesCount", { count: files.length });
    }

    async function uploadSelected() {
      const input = document.getElementById("file-input");
      if (!input.files.length) { toast(tOr("project.error.noFile"), true); return; }
      await uploadFiles(input.files);
      input.value = "";
      updateFileNames();
    }

    async function uploadFiles(fileList) {
      const btn = document.getElementById("upload-btn");
      btn.disabled = true;
      let ok = 0, fail = 0;
      try {
        for (const file of fileList) {
          try {
            const fd = new FormData();
            fd.append("file", file);
            const res = await apiUpload(`/api/projects/${projectId}/documents`, fd);
            toast(`${file.name} → v${res.version}`);
            ok++;
          } catch (e) {
            toast(`${file.name}: ${e.message}`, true);
            fail++;
          }
        }
        if (fileList.length > 1) {
          toast(fail > 0 ? tOr("project.upload.doneFail", { ok, fail }) : tOr("project.upload.done", { count: ok }), fail > 0);
        }
        await loadDocuments();
      } finally {
        btn.disabled = false;
      }
    }

    // Drag & drop onto the upload card
    (function initDropzone() {
      const zone = document.getElementById("upload-card");
      let depth = 0;
      zone.addEventListener("dragenter", (e) => { e.preventDefault(); depth++; zone.classList.add("dragging"); });
      zone.addEventListener("dragover", (e) => { e.preventDefault(); });
      zone.addEventListener("dragleave", () => { if (--depth <= 0) { depth = 0; zone.classList.remove("dragging"); } });
      zone.addEventListener("drop", async (e) => {
        e.preventDefault();
        depth = 0;
        zone.classList.remove("dragging");
        const files = [...(e.dataTransfer?.files || [])];
        if (files.length) await uploadFiles(files);
      });
    })();

    async function deleteDocGroup(i) {
      const g = docGroups[i];
      if (!g) return;
      const n = g.versions.length;
      const ok = await appConfirm({
        title: tOr("project.confirm.deleteDoc"),
        message: tOr("project.confirm.deleteDocMsg", { name: g.filename, count: n }),
        okLabel: tOr("project.confirm.deleteOk"),
        danger: true,
      });
      if (!ok) return;
      let fail = 0;
      for (const v of g.versions) {
        try { await apiDelete(`/api/documents/${v.id}`); }
        catch (e) { fail++; }
      }
      toast(fail ? tOr("project.toast.deletePartial", { fail, count: n }) : tOr("project.toast.deleted", { name: g.filename }), fail > 0);
      await loadDocuments();
    }

    // ---------- members ----------

    async function loadMembers() {
      try {
        membersCache = await apiGet(`/api/projects/${projectId}/members`);
        membersError = null;
      } catch (e) {
        membersCache = null;
        membersError = (e && e.message) || "";
      }
      renderMembers();
    }

    // Build the member list from cache via DOM APIs + textContent only
    // (no innerHTML — XSS policy). Rebuilt on every I18N.onChange repaint.
    function renderMembers() {
      const el = document.getElementById("member-list");
      if (!el) return;
      el.textContent = "";
      if (membersError !== null) {
        // Server messages are not translatable keys: show as-is.
        const err = document.createElement("div");
        err.className = "empty";
        err.textContent = membersError;
        el.appendChild(err);
        return;
      }
      if (!membersCache) return; // not loaded yet
      if (!membersCache.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = tOr("project.members.empty");
        el.appendChild(empty);
        return;
      }
      membersCache.forEach((m) => {
        const item = document.createElement("div");
        item.className = "list-item";
        const main = document.createElement("div");
        main.className = "item-main";
        const name = document.createElement("div");
        name.className = "item-title";
        name.textContent = m.display_name || "—";
        const sub = document.createElement("div");
        sub.className = "item-sub";
        sub.textContent = m.email || "";
        main.append(name, sub);
        const side = document.createElement("div");
        side.className = "item-side";
        const role = document.createElement("span");
        role.className = "badge badge-ai";
        // Role label via t(); unknown roles fall back to the raw value.
        const roleKey = "project.role." + m.member_role;
        role.textContent = tOr(roleKey) !== roleKey ? tOr(roleKey) : m.member_role;
        side.appendChild(role);
        if (m.account_role === "client" && m.user_id !== currentProfile.id) {
          const resetBtn = document.createElement("button");
          resetBtn.className = "btn btn-ghost btn-sm";
          resetBtn.textContent = tOr("project.pwreset");
          // Event delegation via closure — no email/userId embedded in inline onclick (XSS).
          resetBtn.addEventListener("click", () => resetPassword(m.user_id, m.email));
          side.appendChild(resetBtn);
        }
        if (m.user_id !== currentProfile.id) {
          const removeBtn = document.createElement("button");
          removeBtn.className = "btn btn-ghost btn-sm";
          removeBtn.textContent = tOr("project.remove");
          removeBtn.addEventListener("click", () => removeMember(m.user_id));
          side.appendChild(removeBtn);
        } else {
          const youBadge = document.createElement("span");
          youBadge.className = "badge";
          youBadge.textContent = tOr("project.you");
          side.appendChild(youBadge);
        }
        item.append(main, side);
        el.appendChild(item);
      });
    }

    async function inviteMember() {
      const email = document.getElementById("member-email").value.trim().toLowerCase();
      const display_name = document.getElementById("member-name").value.trim();
      const member_role = document.getElementById("member-role").value;
      if (!email) { toast(tOr("project.error.emailRequired"), true); return; }
      try {
        const res = await apiPost(`/api/projects/${projectId}/members/invite`, { email, display_name, member_role });
        document.getElementById("member-email").value = "";
        document.getElementById("member-name").value = "";
        if (res.created && res.password) {
          showPassword(tOr("project.pw.created", { email: res.email }), res.password);
          toast(tOr("project.toast.memberAdded"));
        } else {
          hidePassword();
          toast(tOr("project.toast.existing"));
        }
        await loadMembers();
      } catch (e) {
        toast(e.message, true);
      }
    }

    function showPassword(title, pw) {
      document.getElementById("pw-title").textContent = title;
      document.getElementById("pw-value").textContent = pw;
      document.getElementById("pw-reveal").hidden = false;
    }
    function hidePassword() { document.getElementById("pw-reveal").hidden = true; }

    async function copyPassword() {
      const pw = document.getElementById("pw-value").textContent;
      try { await navigator.clipboard.writeText(pw); toast(tOr("project.toast.copied")); }
      catch (e) { toast(tOr("project.toast.copyFailed"), true); }
    }

    async function resetPassword(userId, email) {
      const ok2 = await appConfirm({
        title: tOr("project.confirm.resetPw"),
        message: tOr("project.confirm.resetPwMsg", { email }),
        okLabel: tOr("project.confirm.resetOk"),
        danger: true,
      });
      if (!ok2) return;
      try {
        const res = await apiPost(`/api/projects/${projectId}/members/${userId}/reset-password`);
        showPassword(tOr("project.pw.newPw", { email: res.email }), res.password);
        toast(tOr("project.toast.pwReset"));
      } catch (e) {
        toast(e.message, true);
      }
    }

    async function removeMember(userId) {
      const ok = await appConfirm({
        title: tOr("project.confirm.removeMember"),
        message: tOr("project.confirm.removeMemberMsg"),
        okLabel: tOr("project.confirm.removeOk"),
        danger: true,
      });
      if (!ok) return;
      try {
        await apiDelete(`/api/projects/${projectId}/members/${userId}`);
        toast(tOr("project.toast.memberRemoved"));
        await loadMembers();
      } catch (e) {
        toast(tOr("project.toast.removeFailed", { message: e.message }), true);
      }
    }

    init();
  </script>
</body>
</html>
